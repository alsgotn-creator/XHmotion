<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Noitom — 모션 디자이너의 월드</title>
  <meta name="description" content="스크롤해서 Noitom의 월드를 날아다녀 보세요." />
  <style>
    /* 생성된 장면의 배경색/팔레트와 맞춥니다 */
    :root, .sw-root {
      --sw-bg: #ebebeb;        /* == 스틸의 배경색 */
      --sw-ink: #141414;
      --sw-ink-soft: #8a8a8a;
      --sw-accent: #ff4d1c;    /* 섹션별 accent가 런타임에 덮어씁니다 */
    }

    /* 드래프트 표식 — 텍스트를 나중에 얹을 예정이라 지금은 카피가 비어 있습니다 */
    .draft-badge {
      position: fixed; left: 16px; bottom: 16px; z-index: 9999;
      font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .14em; text-transform: uppercase;
      color: #ebebeb; background: rgba(20,20,20,.72);
      padding: 8px 12px; border-radius: 999px;
      pointer-events: none; backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>
  <div class="draft-badge">Draft · 720p · 텍스트 미적용</div>

  <script src="scrub-engine.js"></script>
  <script>
    // 장면 순서 = 디즈니 애니메이션 12법칙 + 아이들링.
    // 카피(eyebrow/title/body/tags)는 의도적으로 비워뒀습니다 — 나중에 위에 얹을 예정이라
    // 엔진이 아무 텍스트도 렌더하지 않습니다.
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Noitom', href: '#top' },
      hint: '스크롤해서 날아 들어가 보세요',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        { id: 'welcome-gate',      label: '환영의 문',     still: 'assets/scene1.webp', clip: 'assets/vid/dive1.mp4', accent: '#ff4d1c' },
        { id: 'bounce-plaza',      label: '바운스 광장',   still: 'assets/scene2.webp', clip: 'assets/vid/dive2.mp4', accent: '#073bc7' },
        { id: 'anticipation-hill', label: '예비동작 언덕', still: 'assets/scene3.webp', clip: 'assets/vid/dive3.mp4', accent: '#ff4d1c' },
        { id: 'arc-bridge',        label: '호의 다리',     still: 'assets/scene4.webp', clip: 'assets/vid/dive4.mp4', accent: '#073bc7' },
        { id: 'easing-valley',     label: '이징 계곡',     still: 'assets/scene5.webp', clip: 'assets/vid/dive5.mp4', accent: '#ff4d1c' },
        { id: 'the-studio',        label: '작업실',        still: 'assets/scene6.webp', clip: 'assets/vid/dive6.mp4', accent: '#073bc7' },
      ],
      // 길이 = sections.length - 1, 순서대로
      connectors: [
        'assets/vid/c12.mp4',
        'assets/vid/c23.mp4',
        'assets/vid/c34.mp4',
        'assets/vid/c45.mp4',
        'assets/vid/c56.mp4',
      ],
    });
  </script>
</body>
</html>
